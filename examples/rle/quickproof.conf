# quickproof config for the example rle (quickproof/tools/clight.sh): the library units.  qp adds one unit per
# harness/*.c.  Per-law linking: each law's program links only the units its harness needs (docs/LINKING.md).
LINK=per-law
INC=(-I. -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "rle.c=src/rle"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
