name: Soundness report
description: Coq accepted a theorem that should not hold, or qp verify passed a proof it should have refused.
labels: [bug, soundness]
body:
  - type: markdown
    attributes:
      value: |
        If the problem lets someone pass off a false result as proved, please do not open a public issue.
        Report it privately as described in the [security policy](https://github.com/genproof/quickproof-public/security/policy).
  - type: textarea
    id: what
    attributes:
      label: What was accepted
      description: |
        The theorem or the proof repository, and why it should not have been accepted. For example, a harness
        that fails on some input but has a proof, or a proof that qp verify passed although it changed the
        statement of the contract.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The proof repository (a URL and a commit, or an attached archive), the qp verify command and its
        output. For a false theorem, an input on which the harness fails, if you have one.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The QuickProof commit or release, and the versions of Coq, CompCert and VST.
      placeholder: QuickProof v0.1.0, Coq 8.20.1, CompCert 3.15, VST 2.15
